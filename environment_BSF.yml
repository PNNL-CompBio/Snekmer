name: snekmer
channels:
  - anaconda
  - bioconda
  - numba
  - conda-forge
dependencies:
  - python >= 3.11, <3.12  # asyncore deprecated in 3.12
  - biopython
  - pyarrow
  - jinja2
  - matplotlib
  - numpy >= 1.22.3
  - numba >= 0.56
  - scipy
  - pandas
  - seaborn
  - scikit-learn
  - snakemake == 9.13
  - tabulate == 0.8.10
  - umap-learn
  - hdbscan
  - pip
  - pip:
      - snekmer
      - -e git+https://github.com/PNNL-Compbio/bsf-jaccard-py#egg=bsf  # deprecated!
