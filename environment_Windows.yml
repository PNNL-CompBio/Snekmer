name: snekmer
channels:
  - anaconda
  - bioconda
  - numba
  - conda-forge
dependencies:
  - python >= 3.11
  - biopython
  - pyarrow
  - jinja2
  - matplotlib
  - numpy >= 1.22.3
  - numba >= 0.56
  - scipy
  - pandas < 3.0
  - seaborn
  - scikit-learn
  - snakemake-minimal == 9.13
  - tabulate == 0.8.10
  - umap-learn
  - hdbscan
  - pip
  - pip:
      - snekmer
